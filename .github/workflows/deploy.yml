# CareerOS, GitHub Actions
# Validates the n8n workflow JSON files, then publishes index.html to GitHub Pages on push to main.

name: Deploy Portfolio Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate workflow JSONs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate n8n workflow JSONs
        run: |
          echo "Validating workflow JSON files..."
          for f in n8n-workflows/*.json; do
            python3 -c "import json, sys; json.load(open('$f')); print('OK', '$f')"
          done

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
